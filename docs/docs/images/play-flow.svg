<circle cx="130" cy="58" r="11" fill="#4FE0C8"/><text x="130" y="62.5" font-size="12" fill="#06201C" font-weight="700" text-anchor="middle" >1</text>
<text x="104" y="148" font-size="15" fill="#F2F6F7" font-weight="700" text-anchor="middle" >Press Play</text>
